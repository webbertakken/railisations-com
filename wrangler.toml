name = "railisations-com"
main = "src/index.js"
compatibility_date = "2026-05-07"
workers_dev = true

routes = [
  { pattern = "railisations.com", custom_domain = true },
  { pattern = "www.railisations.com", custom_domain = true },
  { pattern = "railizations.com", custom_domain = true },
  { pattern = "www.railizations.com", custom_domain = true },
]

[assets]
# Static export from `next build` (output: 'export') lives in ./out
directory = "./out"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true
