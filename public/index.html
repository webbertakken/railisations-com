<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RAIlisations — soon</title>
    <meta name="description" content="RAIlisations. Coming soon." />
    <meta name="color-scheme" content="dark" />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        background: #0b0b0f;
        color: #f4f4f5;
        font-family:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        display: grid;
        place-items: center;
        text-align: center;
        overflow: hidden;
      }
      .glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            60rem 40rem at 30% 20%,
            rgba(99, 102, 241, 0.18),
            transparent 60%
          ),
          radial-gradient(
            50rem 30rem at 80% 80%,
            rgba(236, 72, 153, 0.15),
            transparent 60%
          );
        pointer-events: none;
      }
      main {
        position: relative;
        padding: 2rem;
      }
      h1 {
        font-size: clamp(3rem, 12vw, 8rem);
        font-weight: 800;
        letter-spacing: -0.04em;
        margin: 0;
        background: linear-gradient(180deg, #ffffff, #a1a1aa);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        margin: 1rem 0 0;
        color: #a1a1aa;
        font-size: clamp(1rem, 2.4vw, 1.25rem);
        letter-spacing: 0.02em;
      }
      .dot {
        display: inline-block;
        width: 0.5em;
        height: 0.5em;
        border-radius: 50%;
        background: #22c55e;
        margin-right: 0.5em;
        vertical-align: middle;
        box-shadow: 0 0 1rem rgba(34, 197, 94, 0.6);
        animation: pulse 1.8s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.6;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.2);
        }
      }
    </style>
  </head>
  <body>
    <div class="glow" aria-hidden="true"></div>
    <main>
      <h1>soon.</h1>
      <p><span class="dot" aria-hidden="true"></span>RAIlisations is on its way.</p>
    </main>
  </body>
</html>
